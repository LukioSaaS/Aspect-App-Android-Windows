<style>
/* Layout: fileiras de cartazes estilo streaming sobre um fundo quase preto com brilho indigo; destaque com titulo condensado.
   Tipos: Archivo condensada (titulos e marca) + Figtree (interface). Tudo em rem para escalar na TV. */
:root {
  color-scheme: dark;
  --bg: #050505;
  --bg-1: #0a0909;
  --bg-2: #111010;
  --bg-3: #1a1717;
  --bg-4: #262121;
  --fg: #f6eee5;
  --fg-2: #cbc0b4;
  --fg-3: #92877c;
  --fg-4: #62584f;
  --line: rgba(242, 230, 217, .09);
  --line-2: rgba(242, 230, 217, .18);
  --acc: #d71f2b;
  --acc-rgb: 215, 31, 43;
  --acc2: #7d1019;
  --acc2-rgb: 125, 16, 25;
  --ok: #3ccf7a;
  --warn: #f5b031;
  --live: #ff2a4a;
  --score: #46d369;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-disp: "Bodoni Moda", "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif;
  --cream: #f2e6d9;
  --cream-2: #d6c9ba;
  --pad: 4vw;
  --hdr: 4.25rem;
  --card-w: 10.4rem;
  --gap: .55rem;
  --cols: 7;
  --r-xs: .25rem;
  --r-s: .25rem;
  --r: .35rem;
  --r-l: .55rem;
  --r-xl: .75rem;
  --ease: cubic-bezier(.2, .75, .25, 1);
  --gd-ch: 14rem;
  --gd-row: 4.3rem;
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { --sat: 0px; --sat: max(env(safe-area-inset-top, 0px), var(--ins-t, 0px)); --sab: max(env(safe-area-inset-bottom, 0px), var(--ins-b, 0px), .9rem); --hdr-t: calc(var(--hdr) + var(--sat)); }
html, body { touch-action: pan-x pan-y; }
.pl .pl-v { background: #000; }
html.exo-on, html.exo-on body { background: transparent !important; }
html.exo-on #app { visibility: hidden; }
.pl.exo { background: transparent; }
.pl.exo .pl-v { visibility: hidden; }
@keyframes rb-fill-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
html[data-layout="tv"] .hdr, html[data-layout="tv"] .btn-ghost, html[data-layout="tv"] .pf { -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-layout="tv"] .btn-ghost { background: rgba(92, 92, 112, .55); }
html[data-layout="tv"] .pf { background: rgba(17, 16, 16, .9); }
html[data-layout="tv"] .hero-bg img, html[data-layout="tv"] .dt-bg img { will-change: transform, opacity; }
html[data-layout="tv"] .hero-dots i b { transform-origin: 0 50%; }
html[data-layout="tv"] .hero-dots i.on b { width: 100%; animation-name: rb-fill-x; }
html[data-layout="tv"] .card { contain: layout style; }
.pl-castbar { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: .6rem; padding: .55rem 1.1rem; border-radius: 99px; background: rgba(255, 255, 255, .12); color: #fff; font-size: .95rem; font-weight: 600; pointer-events: none; white-space: nowrap; }
.pl-castbar .ic { width: 1.3rem; height: 1.3rem; }
.pl .pl-big.main { min-height: 0; height: 4.8rem; padding: 0; background: none; box-shadow: none; }
.pl-top, .pl-bot { padding-left: calc(2rem + var(--ins-l, 0px)); padding-right: calc(2rem + var(--ins-r, 0px)); }
html[data-layout="mob"] .pl-top, html[data-layout="mob"] .pl-bot { padding-left: calc(1rem + var(--ins-l, 0px)); padding-right: calc(1rem + var(--ins-r, 0px)); }
html[data-layout="mob"] input, html[data-layout="mob"] select, html[data-layout="mob"] textarea { font-size: 16px; }
@media (orientation: portrait) {
  html.force-land .pl:not(.mini) { top: 0; left: 100%; right: auto; bottom: auto; width: 100vh; width: 100dvh; height: 100vw; height: 100dvw; transform: rotate(90deg); transform-origin: top left; }
}
* { scrollbar-width: none !important; -ms-overflow-style: none !important; }
*::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
html { font-size: 16px; background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html[data-layout="desk"] { font-size: 15px; }
@media (min-width: 1280px) { html[data-layout="desk"] { font-size: 16px; --cols: 7; } }
@media (min-width: 1600px) { html[data-layout="desk"] { font-size: 17px; --cols: 8; } }
@media (min-width: 2200px) { html[data-layout="desk"] { font-size: 20px; } }
@media (max-width: 1100px) { html[data-layout="desk"] { --cols: 6; --card-w: 9.6rem; } }
@media (max-width: 900px) { html[data-layout="desk"] { --cols: 5; } }
html[data-layout="tv"] { font-size: 1.1vw; --pad: 3.4rem; --card-w: 9.2rem; --hdr: 4.6rem; --cols: 8; --gap: .6rem; }
html[data-layout="mob"] { font-size: 15px; --pad: 1rem; --card-w: 7.1rem; --gap: .45rem; --hdr: 3.6rem; --cols: 3; --gd-ch: 6.6rem; --gd-row: 3.9rem; }
@media (min-width: 520px) { html[data-layout="mob"] { --cols: 4; } }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 1rem; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; overscroll-behavior-y: none;
}
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; height: 85vh; pointer-events: none; z-index: 0;
  background: radial-gradient(70% 60% at 10% -10%, rgba(var(--acc2-rgb), .30), rgba(var(--acc2-rgb), 0) 70%),
    radial-gradient(45% 45% at 95% -8%, rgba(var(--acc-rgb), .13), rgba(var(--acc-rgb), 0) 70%);
}
#app { position: relative; z-index: 1; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; opacity: .6; }
input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { text-wrap: balance; }
:focus { outline: none; }
.ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; display: inline-block; vertical-align: middle; overflow: visible; }
.tv-only { display: none; }
html[data-layout="tv"] .tv-only { display: inline; }
html[data-layout="mob"] .hide-mob { display: none !important; }
.muted { color: var(--fg-3); }
.dot { display: inline-block; width: .26rem; height: .26rem; border-radius: 50%; background: var(--fg-4); margin: 0 .5rem; vertical-align: middle; }
.eyebrow { display: block; font-size: .76rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-3); }

/* marca */
.wm {
  display: inline-block; font-family: var(--f-disp); font-weight: 900; font-stretch: 70%; font-variation-settings: "wdth" 70;
  text-transform: uppercase; letter-spacing: .02em; font-size: 1.7rem; line-height: 1; padding: .06em 0;
  background: linear-gradient(100deg, var(--acc) 5%, var(--acc2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.wm.lg { font-size: 3.4rem; }

/* ---------------------------------------------------------------- botoes e controles */
.btn {
  display: inline-flex; align-items: center; justify-content: center; height: 2.75rem; padding: 0 1.35rem; border-radius: var(--r-s);
  font-weight: 700; font-size: 1rem; white-space: nowrap; transition: background .15s, color .15s, transform .15s, box-shadow .15s; position: relative;
}
.btn .ic { width: 1.35rem; height: 1.35rem; margin-right: .55rem; }
.btn .spin { margin-left: .6rem; }
.btn-lg { height: 3.1rem; padding: 0 1.75rem; font-size: 1.08rem; }
.btn-lg .ic { width: 1.55rem; height: 1.55rem; }
.btn-primary { background: #fff; color: #0a0a10; }
.btn-primary:hover { background: rgba(255, 255, 255, .82); }
.btn-ghost { background: rgba(122, 122, 145, .36); color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(122, 122, 145, .24); }
.btn-outline { color: #fff; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .45); }
.btn-outline:hover { box-shadow: inset 0 0 0 2px #fff; }
.btn-danger { background: #e5363d; color: #fff; }
.btn-danger-ghost { color: #ff7a7f; background: rgba(229, 54, 61, .12); }
.btn-icon { width: 2.75rem; height: 2.75rem; padding: 0; border-radius: 50%; background: rgba(18, 18, 26, .5); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .5); }
.btn-icon .ic { margin: 0; width: 1.4rem; height: 1.4rem; }
.btn-icon:hover { box-shadow: inset 0 0 0 2px #fff; }
.btn-icon .lbl { display: none; }
.chip {
  display: inline-flex; align-items: center; height: 2.4rem; padding: 0 1rem; border-radius: 2rem; white-space: nowrap;
  background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; font-size: .92rem; color: var(--fg);
  transition: background .15s, color .15s, box-shadow .15s, transform .15s;
}
.chip .ic { width: 1.1rem; height: 1.1rem; }
.chip .ic:first-child { margin-right: .45rem; }
.chip span + .ic { margin-left: .35rem; }
.chip:hover { background: rgba(255, 255, 255, .14); }
.chip.on { background: #fff; color: #0a0a10; box-shadow: none; }
.inp {
  width: 100%; height: 3rem; padding: 0 1rem; background: var(--bg-3); color: var(--fg); border: 1px solid var(--line-2); border-radius: var(--r-s);
  font-size: 1rem; outline: none; -webkit-appearance: none; appearance: none; transition: border-color .15s, box-shadow .15s;
}
.inp::placeholder { color: var(--fg-4); }
.inp:focus { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
.sw { position: relative; flex: 0 0 auto; width: 2.75rem; height: 1.6rem; border-radius: 1rem; background: var(--bg-4); transition: background .2s; }
.sw i { position: absolute; top: .2rem; left: .2rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.sw.on { background: var(--acc); }
.sw.on i { transform: translateX(1.15rem); }
.pb { display: block; height: .2rem; background: rgba(255, 255, 255, .16); border-radius: 1rem; overflow: hidden; margin-top: .35rem; }
.pb i { display: block; height: 100%; width: 0; background: var(--acc); border-radius: inherit; transition: width .4s; }
.m-rec { display: inline-block; background: rgba(255, 255, 255, .18); color: #fff; font-weight: 800; font-size: .66rem; letter-spacing: .08em; padding: .16rem .45rem; border-radius: .25rem; line-height: 1.2; }
.pl.k-cu .pl-live { display: block; }
.m-live { display: inline-block; background: var(--live); color: #fff; font-weight: 800; font-size: .66rem; letter-spacing: .08em; padding: .16rem .45rem; border-radius: .25rem; line-height: 1.2; }
.spin { display: inline-block; line-height: 0; }
.spin i { display: inline-block; width: 2.4rem; height: 2.4rem; border-radius: 50%; border: .26rem solid rgba(255, 255, 255, .14); border-top-color: var(--acc); animation: rb-spin .8s linear infinite; }
.spin.sm i { width: 1.15rem; height: 1.15rem; border-width: .16rem; }
.spin.lg i { width: 3.8rem; height: 3.8rem; border-width: .3rem; }
@keyframes rb-spin { to { transform: rotate(360deg); } }
@keyframes rb-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-.5rem); } 75% { transform: translateX(.5rem); } }
@keyframes rb-fill { from { width: 0; } to { width: 100%; } }
@keyframes rb-rip { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.4); } }
@keyframes rb-in { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }

/* foco visivel (teclado e controle remoto) */
html[data-input="key"] .btn:focus, html[data-layout="tv"] .btn:focus { box-shadow: 0 0 0 .18rem var(--bg), 0 0 0 .36rem #fff; transform: scale(1.04); }
html[data-input="key"] .btn-ghost:focus, html[data-layout="tv"] .btn-ghost:focus,
html[data-input="key"] .btn-outline:focus, html[data-layout="tv"] .btn-outline:focus,
html[data-input="key"] .btn-icon:focus, html[data-layout="tv"] .btn-icon:focus,
html[data-input="key"] .btn-danger-ghost:focus, html[data-layout="tv"] .btn-danger-ghost:focus { background: #fff; color: #0a0a10; box-shadow: none; }
html[data-input="key"] .chip:focus, html[data-layout="tv"] .chip:focus { box-shadow: 0 0 0 .18rem #fff; background: rgba(255, 255, 255, .2); transform: scale(1.05); }
html[data-input="key"] .chip.on:focus, html[data-layout="tv"] .chip.on:focus { background: #fff; box-shadow: 0 0 0 .18rem var(--bg), 0 0 0 .34rem #fff; }
html[data-input="key"] .inp:focus, html[data-layout="tv"] .inp:focus { border-color: #fff; box-shadow: 0 0 0 .14rem #fff; }

/* ---------------------------------------------------------------- cabecalho e barra inferior */
.hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding-top: 0px; padding-top: max(env(safe-area-inset-top, 0px), var(--ins-t, 0px));
  background: linear-gradient(180deg, rgba(5, 5, 5, .82) 0%, rgba(5, 5, 5, .4) 60%, rgba(5, 5, 5, 0) 100%); transition: background .35s;
}
.hdr.solid, .hdr.force-solid, html[data-route="settings"] .hdr, html[data-route="search"] .hdr, html[data-route="mylist"] .hdr, html[data-route="category"] .hdr, html[data-route="live"] .hdr {
  background: rgba(5, 5, 5, .94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 1px 0 var(--line);
}
.hdr-in { display: flex; align-items: center; height: var(--hdr); padding: 0 var(--pad); }
.hdr-logo { display: inline-flex; align-items: center; margin-right: 2.4rem; }
.hdr-nav { display: flex; align-items: center; }
.nav-i { position: relative; margin-right: 1.4rem; padding: .4rem 0; font-size: .93rem; font-weight: 500; color: var(--fg-2); transition: color .15s; }
.nav-i:hover { color: #fff; }
.nav-i.on { color: #fff; font-weight: 700; }
.nav-i.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.1rem; height: .19rem; border-radius: .2rem; background: var(--acc); }
.hdr-r { margin-left: auto; display: flex; align-items: center; }
.nav-ic { display: inline-flex; align-items: center; justify-content: center; height: 2.5rem; min-width: 2.5rem; border-radius: 1.3rem; margin-left: .35rem; color: #fff; transition: background .15s; }
.nav-ic .ic { width: 1.4rem; height: 1.4rem; }
.nav-ic:hover { background: rgba(255, 255, 255, .1); }
.nav-ic.on { background: rgba(255, 255, 255, .12); }
.nav-av { margin-left: .8rem; border-radius: .45rem; display: inline-flex; transition: box-shadow .15s, transform .15s; }
.tabbar { display: none; }
.main { position: relative; min-height: 100vh; }
html[data-input="key"] .nav-i:focus, html[data-layout="tv"] .nav-i:focus { color: #0a0a10; background: #fff; border-radius: 2rem; padding: .4rem .9rem; margin-left: -.9rem; margin-right: .5rem; }
html[data-input="key"] .nav-i.on:focus::after, html[data-layout="tv"] .nav-i.on:focus::after { display: none; }
html[data-input="key"] .nav-ic:focus, html[data-layout="tv"] .nav-ic:focus { background: #fff; color: #0a0a10; }
html[data-input="key"] .nav-av:focus, html[data-layout="tv"] .nav-av:focus { box-shadow: 0 0 0 .16rem var(--bg), 0 0 0 .32rem #fff; transform: scale(1.06); }

/* TV: navegacao no topo em formato de pilulas */
html[data-layout="tv"] .hdr { background: linear-gradient(180deg, rgba(5, 5, 5, .95) 0%, rgba(5, 5, 5, .7) 70%, rgba(5, 5, 5, 0) 100%); }
html[data-layout="tv"] .nav-i { padding: .45rem .95rem; margin-right: .35rem; border-radius: 2rem; font-size: 1rem; }
html[data-layout="tv"] .nav-i.on { background: rgba(255, 255, 255, .1); }
html[data-layout="tv"] .nav-i.on::after { left: .95rem; right: .95rem; bottom: .15rem; height: .15rem; }
html[data-layout="tv"] .nav-i:focus { margin-left: 0; margin-right: .35rem; padding: .45rem .95rem; }
html[data-layout="tv"] .nav-ic { padding: 0 .8rem; }
html[data-layout="tv"] .nav-ic span { margin-left: .45rem; font-weight: 600; }

/* celular: barra superior simples + abas inferiores */
html[data-layout="mob"] .hdr-nav { display: none; }
html[data-layout="mob"] .hdr-logo { margin-right: auto; }
html[data-layout="mob"] .hdr-logo .wm { font-size: 1.55rem; }
html[data-layout="mob"] .tabbar {
  display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: .35rem .2rem calc(.35rem + 0px); padding: .35rem .2rem calc(.35rem + var(--sab));
  background: rgba(5, 5, 5, .97); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 -1px 0 var(--line);
}
.tb-i { flex: 1; display: flex; flex-direction: column; align-items: center; padding: .3rem 0 .1rem; color: var(--fg-3); font-size: .66rem; font-weight: 600; }
.tb-i .ic { width: 1.45rem; height: 1.45rem; margin-bottom: .18rem; }
.tb-i.on { color: #fff; }
html[data-layout="mob"] .main { padding-bottom: calc(4.4rem + var(--sab)); }
html.playing-full .tabbar, html.playing-full .hdr { visibility: hidden; }

/* ---------------------------------------------------------------- destaque (hero) */
.browse { position: relative; }
.hero { position: relative; height: 84vh; min-height: 31rem; max-height: 60rem; overflow: hidden; margin-bottom: -7.5rem; background: var(--bg); }
.hero.none { height: calc(var(--hdr-t) + 5rem); min-height: 0; margin-bottom: 0; }
.hero.none .hero-c, .hero.none .hero-shade { display: none; }
.hero-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.hero-bg img.hb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; opacity: 0; transition: opacity .9s ease; }
.hero-bg img.hb.on { opacity: 1; }
.hero-bg img.hb.poster { filter: blur(26px) saturate(1.25); transform: scale(1.2); }
.hero-bg img.hb.poster.on { opacity: .55; }
.hero.live .hero-bg img.hb { object-fit: contain; width: 34%; height: 50%; left: auto; right: 9%; top: 18%; filter: none; transform: none; }
.hero.live .hero-bg img.hb.on { opacity: .9; }
.hero-shade {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, rgba(5, 5, 5, .94) 0%, rgba(5, 5, 5, .66) 28%, rgba(5, 5, 5, .12) 60%, rgba(5, 5, 5, 0) 75%),
    linear-gradient(0deg, var(--bg) 0%, rgba(5, 5, 5, .7) 16%, rgba(5, 5, 5, 0) 42%),
    radial-gradient(55% 75% at 0% 100%, rgba(var(--acc2-rgb), .26), rgba(var(--acc2-rgb), 0) 70%);
}
.hero-c { position: absolute; left: var(--pad); bottom: 31%; width: 44%; max-width: 42rem; z-index: 2; animation: rb-in .5s var(--ease); }

  background: linear-gradient(to bottom right, rgba(var(--acc-rgb), .10) 0, rgba(var(--acc-rgb), .10) 49.6%, rgba(var(--acc-rgb), .95) 50%, rgba(var(--acc-rgb), 0) 50.5%);

  function schedule(ch, list2, token) {

      const live = p.s <= now && p.e > now;

      const can = past && ch.arch && (p.arch || now - p.s < ch.arch * 864e5);
      h += '<button type="button" class="prg' + (live ? " now" : past ? " past" : "") + '" data-f data-act="lvPrg" data-i="' + i + '"' + (live ? " data-autofocus" : "") + '><span class="prg-t">' + fmtClock(p.s) + '</span><span class="prg-x"><b>' + esc(p.t) + "</b>" + (p.d && live ? "<small>" + esc(p.d) + "</small>" : "") + "</span>" + (live ? '<span class="m-live">AO VIVO</span>' : can ? '<span class="prg-cu">' + ic("history") + "<span>Assistir</span></span>" : "") + "</button>";

    const cur = sched.querySelectorAll(".prg")[curI];

  }
  var PPM_REM = 0.42;
  function drawGuide(body) {

    const anyArch = itemsOf(S2.cat).some((c) => c.arch);
    const t0 = Math.floor((now - (anyArch ? 3 : 1) * 36e5) / 18e5) * 18e5;
    const t1 = t0 + 14 * 36e5;
    const W = Math.round((t1 - t0) / 6e4 * ppm);
    S2.g = { t0, t1, ppm, W };
    let items = itemsOf(S2.cat);
    if (S2.q) {
      const q = norm(S2.q);
      items = Catalog.allAllowed("live").filter((c) => {
        if (!c._n) c._n = norm(c.name);
        return c._n.indexOf(q) > -1;
      });
    }
    S2.items = items;
    const cat = S2.cats.filter((c) => c.id === S2.cat)[0];
    let ruler = "";
    for (let t = t0; t < t1; t += 18e5) ruler += '<span style="left:' + Math.round((t - t0) / 6e4 * ppm) + 'px">' + fmtClock(t) + "</span>";
    body.innerHTML = '<div class="gd"><div class="gd-top"><div class="gd-corner" data-row><button type="button" class="chip" data-f data-act="lvGuideCat">' + ic("listul") + "<span>" + esc(cat ? cat.name : "Categoria") + "</span>" + ic("chev-d") + '</button><button type="button" class="chip" data-f data-act="lvGuideNow">' + ic("clock") + '<span>Agora</span></button></div><div class="gd-ruler"><div class="gd-ruler-in" style="width:' + W + 'px">' + ruler + '</div></div></div><div class="gd-main"><div class="gd-chs"><div class="gd-chs-in"></div></div><div class="gd-grid" data-vs data-vs-own data-own-scroll><div class="gd-rows" style="width:' + W + 'px"></div><i class="gd-now"></i></div></div></div>';
    const chs = body.querySelector(".gd-chs-in"), rows = body.querySelector(".gd-rows"), grid = body.querySelector(".gd-grid"), rul = body.querySelector(".gd-ruler");
    if (!items.length) {
      rows.innerHTML = '<div class="empty sm"><p>Nenhum canal nesta categoria.</p></div>';
      return;
    }
    let ch = "", rw = "";
    items.forEach((c) => {
      ch += '<div class="gd-ch" data-id="' + c.id + '"><span class="chn-n">' + c.num + '</span><span class="chn-l">' + (c.logo ? '<img data-src="' + esc(Catalog.img(c.logo, "w300")) + '" alt="">' : "") + "</span><b>" + esc(c.name) + "</b></div>";
      rw += '<div class="gd-row" data-row data-near data-id="' + c.id + '"><button type="button" class="gp empty" data-f data-act="gdPrg" data-id="' + c.id + '" data-i="-1" style="left:0;width:' + W + 'px"><b>' + esc(c.name) + "</b><small>Carregando programação…</small></button></div>";
    });
    chs.innerHTML = ch;
    rows.innerHTML = rw;
    Lazy.scroller(body.querySelector(".gd-chs"), chs);
    grid.addEventListener("scroll", () => {
      rul.scrollLeft = grid.scrollLeft;
      body.querySelector(".gd-chs").scrollTop = grid.scrollTop;
    }, { passive: true });
    body.querySelector(".gd-chs").addEventListener("wheel", (e) => {
      grid.scrollTop += e.deltaY;
      e.preventDefault();
    }, { passive: false });
    const nowLine = body.querySelector(".gd-now");
    const paintNow = () => {
      nowLine.style.left = Math.round((Epg.now() - t0) / 6e4 * ppm) + "px";
      nowLine.style.height = rows.offsetHeight + "px";
    };
    paintNow();
    S2.nowT = setInterval(paintNow, 3e4);
    const io = window.IntersectionObserver ? new IntersectionObserver((l) => {
      l.forEach((e) => {
        if (isIntersecting(e)) {
          io.unobserve(e.target);
          loadRow(e.target);
        }
      });
    }, { root: grid, rootMargin: "300px 0px" }) : null;
    S2.gio = io;
    rows.querySelectorAll(".gd-row").forEach((r) => {
      if (io) io.observe(r);
      else loadRow(r);
    });
    grid.scrollLeft = Math.max(0, (now - t0) / 6e4 * ppm - 120);
    grid.addEventListener("focusin", (e) => {
      const b = e.target.closest(".gp");

    opts.push({ v: "settings", label: "Configurações", icon: "gear" });
    opts.push({ v: "account", label: "Conta e assinatura", icon: "shield" });
    opts.push({ v: "exit", label: "Sair do perfil", icon: "logout" });
    Dialog.choice({ title: Store.active ? Store.active.name : "Perfil", options: opts }).then((v) => {
      if (!v) return;
      if (v.indexOf("p:") === 0) bus.emit("enterProfile", v.slice(2));
      else if (v === "manage") bus.emit("switchProfile", true);
      else if (v === "settings") Router.go("settings", {});
      else if (v === "account") Router.go("settings", { sec: "conta" });
      else if (v === "exit") bus.emit("switchProfile");
    });
  };

  // src/demo-stub.js
  var DemoApi = null;

  // src/main.js
  var HAS_DEMO = !!DemoApi;
  function applyTheme() {
    const a = ACCENTS[Store.s.accent] || ACCENTS.rubi;
    const r = document.documentElement;
    r.style.setProperty("--acc", a.acc);
    r.style.setProperty("--acc-rgb", a.rgb);
    r.style.setProperty("--acc2", a.acc2);
    r.style.setProperty("--acc2-rgb", a.rgb2);
    r.classList.toggle("reduced", Device.reduced());
    r.setAttribute("data-tvstyle", Store.s.tvStyle === "classico" ? "classico" : "novo");
    setClock24(Store.s.clock24 !== false);
  }
  var dirty = false;
  var entering = 0;
  function enterProfile(p) {
    return __async(this, null, function* () {
      if (typeof p === "string") p = Store.getProfile(p);
      if (!p) {
        Gate.profiles();
        return;
      }
      const token = ++entering;
      Player.close();
      Layers.closeAll();
      Shell.hide();
      Router.stack.forEach((e) => Router.destroy(e));
      Router.stack = [];
      Catalog.reset();
      Store.setActive(p);
      Gate.loading(p);
      const api2 = p.demo && HAS_DEMO ? new DemoApi() : new Xtream(p);
      try {
        Gate.progress("Conectando ao servidor…", 0.08);
        yield api2.login();
        if (token !== entering) return;
        Gate.progress("Baixando canais, filmes e séries…", 0.2);
        const names = { live: "canais", movie: "filmes", series: "séries" };
        yield Catalog.load(api2, (done) => {
          const parts = Object.keys(done).filter((k) => done[k] !== null).map((k) => done[k] < 0 ? names[k] + " com erro" : done[k].toLocaleString("pt-BR") + " " + names[k]);
          Gate.progress(parts.length ? "Carregado: " + parts.join(" · ") : "Baixando canais, filmes e séries…", 0.2 + parts.length * 0.26);
        });
        if (token !== entering) return;
        Gate.progress("Tudo pronto", 1);
        Gate.hide();
        Shell.show();
        Nav.root = Shell.el;
        Router.startPage = "home";
        Router.go("home", {}, { force: true });
        const sp = Store.s.startPage;
        if (sp && sp !== "home") Router.go(sp, {});
        const errs = Object.keys(Catalog.errors);
        if (errs.length) toast("Não foi possível carregar: " + errs.map((k) => ({ live: "canais", movie: "filmes", series: "séries" })[k]).join(", "), "alert", 4500);
      } catch (e) {
        if (token !== entering) return;
        Gate.error(p, e, () => enterProfile(p));
      }
    });
  }
  function toGate(manage) {
    Player.close();
    Layers.closeAll();
    Shell.hide();
    Router.stack.forEach((e) => Router.destroy(e));
    Router.stack = [];
    Gate.manage = !!manage;
    Gate.profiles();
  }
  function onBack() {
    if (!Gate.el.hidden) {
      if (Layers.closeTop()) return;
      const inForm = !!Gate.el.querySelector(".pf");
      if (inForm && Store.profiles.length) {
        Gate.manage = false;
        Gate.profiles();
        return;
      }
      if (Gate.manage) {
        Gate.manage = false;
        Gate.profiles();
        return;
      }
      if (Device.layout === "tv") exitConfirm();
      return;
    }
    Router.back(false);
  }
  function exitConfirm() {
    Dialog.confirm({ title: "Sair do " + CONFIG.APP_NAME + "?", ok: "Sair", cancel: "Ficar" }).then((ok) => {
      if (ok) Device.exitApp();
    });
    return true;
  }
  function bindNativeBack() {
    const ap = isNativeApp() && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (!ap || !ap.addListener) return;
    let last = 0;
    ap.addListener("backButton", () => {
      try {
        if (!Gate.el.hidden) {
          if (Layers.closeTop()) return;
          const inForm = !!Gate.el.querySelector(".pf");
          if (inForm && Store.profiles.length || Gate.manage) {
            onBack();
            return;
          }
        } else if (Router.back(true)) return;
      } catch (e) {
      }
      if (Device.layout === "tv") {
        exitConfirm();
        return;
      }
      const now = Date.now();
      if (now - last < 2200) Device.exitApp();
      else {
        last = now;
        toast("Toque em voltar de novo para sair", "alert", 1800);
      }
    });
  }
  function boot() {
    injectIcons();
    bindNativeBack();
    Device.detect();
    applyTheme();
    Device.initInput();
    Device.registerTVKeys();
    document.title = CONFIG.APP_NAME;
    let app = document.getElementById("app");
    if (!app) {
      app = el("div");
      app.id = "app";
      document.body.appendChild(app);
    }
    app.innerHTML = "";
    Gate.mount(app);
    Shell.mount(app);
    const layers = el("div", "layers");
    layers.id = "layers";
    app.appendChild(layers);
    Layers.host = layers;
    Nav.init(Gate.el, onBack);
    Router.init(Shell.main);
    Router.register("home", Pages.home);
    Router.register("movies", Pages.movies);
    Router.register("series", Pages.series);
    Router.register("category", Pages.category);
    Router.register("live", LivePage);
    Router.register("search", SearchPage);
    Router.register("mylist", MyListPage);
    Router.register("settings", SettingsPage);
    Router.exitHandler = (fromHistory) => Device.layout === "tv" ? exitConfirm() : false;
    Lazy.init();
    EpgFill.init();
    Preview.init();
    initActions();
    Gate.onEnter = enterProfile;
    Actions.go = (b) => {
      const page = b.getAttribute("data-page");
      if (page === "live" && Router.cur() && Router.cur().name === "live") return;
      Router.go(page, {});
      if (Device.input === "key" && b.closest("#hdr")) setTimeout(() => {
        const c = Router.cur();
        if (c) Nav.focusDefault(c.el);
      }, 60);
    };
    bus.on("enterProfile", (id) => enterProfile(id));
    bus.on("switchProfile", (manage) => toGate(manage));
    bus.on("editProfile", () => {
      const p = Store.active;
      Player.close();
      Layers.closeAll();
      Shell.hide();
      Gate.form(p);
    });
    bus.on("applied", (key) => {
      applyTheme();
      if (["sort", "hideEmpty", "lockAdult", "*"].indexOf(key) > -1) dirty = true;
      if (key === "accent") {
        Shell.show();
      }
    });
    const refreshRows = () => {
      const c = Router.cur();
      if (c && c.refreshRows && !Layers.top()) c.refreshRows();
    };
    bus.on("progress", () => setTimeout(refreshRows, 50));
    bus.on("fav", () => setTimeout(refreshRows, 50));
    events.on("layers", () => {
      if (!Layers.top()) setTimeout(refreshRows, 60);
    });
    bus.on("cats", () => {
      dirty = true;
    });
    bus.on("unlock", () => {
      dirty = true;
    });
    bus.on("catalog", () => {
      dirty = true;
      toast("Catálogo atualizado", "check");
    });
    bus.on("settings", (k) => {
      if (k === "motion") applyTheme();
      if (k === "tvStyle") {
        applyTheme();
        dirty = true;
      }
    });
    events.on("route", (name) => {
      if (dirty && name !== "settings") {
        dirty = false;
        setTimeout(() => Router.refreshAll(), 0);
      }
    });
    Device.onChange(() => {
      if (Router.cur()) setTimeout(() => Router.refreshAll(), 50);
    });
    if ((CONFIG.ARTIFACT || CONFIG.DEMO) && HAS_DEMO && !Store.profiles.length && CONFIG.ARTIFACT) {
      Store.addProfile({ name: "Demonstração", demo: true, server: "demo", user: "demo", pass: "demo", color: 1, glyph: "av-sun", kids: false });
    }
    const ps = Store.profiles;
    const last = Store.getProfile(Store.lastProfileId());
    if (!ps.length) Gate.form(null);
    else if (ps.length === 1) enterProfile(ps[0]);
    else if (last && ps.length > 1) Gate.profiles();
    else Gate.profiles();
  }
  ["gesturestart", "gesturechange", "gestureend"].forEach((g) => document.addEventListener(g, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener("fullscreenchange", () => {
    if (Device._ls && !Device.isFS()) Device.playerLandscape(true);
  });
  if ("serviceWorker" in navigator && !window.Capacitor && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {
    }));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
