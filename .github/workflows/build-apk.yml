name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícones e tela de abertura
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#050505' --iconBackgroundColorDark '#050505' --splashBackgroundColor '#050505' --splashBackgroundColorDark '#050505'

      - name: Ajustes do app (TV, HTTP, tela cheia)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/patch_android.py

      - name: Sincronizar
        run: npx cap sync android

      - name: Usar a chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aspect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aspect-apk
          path: aspect.apk

      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" aspect.apk \
            --title "Aspect build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente. Baixe o aspect.apk abaixo." \
            --latest
